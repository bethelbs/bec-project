# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "bec-project"
description = "Element-first catalogue of BMEC promoters and enhancers, linked to genes by Hi-C loops, with candidate TF motifs"
authors = ["Bethel Sisay <132695873+bethelbs@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)
numpy = ">=2.5.5,<3"
pyyaml = ">=6.0.3,<7"

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` rebuilds every result from the raw data: download -> Snakemake workflow.
download = { cmd = "python scripts/download_data.py", description = "Download the raw data and verify checksums" }
verify-data = { cmd = "python scripts/download_data.py --verify-only", description = "Check raw data without downloading" }
reproduce = [{ task = "run-snakemake" }]

[feature.pipeline]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.pipeline.dependencies]
snakemake = "*"
snakefmt = "*"
graphviz = "*"
bedtools = "*"
homer = "*"
pybigwig = "*"

[feature.pipeline.tasks]
run-snakemake = { cmd = "snakemake --cores all", depends-on = ["download"], description = "Run the analysis workflow" }

[environments]
pipeline = ["pipeline"]
